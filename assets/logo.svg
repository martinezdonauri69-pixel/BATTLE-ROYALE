<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c0"/><stop offset=".45" stop-color="#f5c04a"/><stop offset="1" stop-color="#a86a0c"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a10"/><stop offset=".6" stop-color="#f5c04a"/><stop offset="1" stop-color="#fff3c0"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#55607a"/><stop offset=".4" stop-color="#151a26"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5cd0"/><stop offset="1" stop-color="#06193f"/>
    </linearGradient>
  </defs>

  <!-- alas -->
  <g id="wl">
    <path d="M142 78C112 56 74 62 36 38c6 38 34 66 82 74 14 2 24 0 30-4z" fill="url(#wing)" stroke="#6b4208" stroke-width="2"/>
    <path d="M140 92C112 78 84 86 54 70c8 28 30 46 70 50z" fill="url(#wing)" opacity=".85" stroke="#6b4208" stroke-width="1.5"/>
  </g>
  <use href="#wl" transform="translate(400 0) scale(-1 1)"/>

  <!-- corona -->
  <path d="M168 40l8-22 12 14 12-20 12 20 12-14 8 22z" fill="url(#gold)" stroke="#6b4208" stroke-width="2" stroke-linejoin="round"/>
  <rect x="168" y="38" width="64" height="9" rx="2" fill="url(#gold)" stroke="#6b4208" stroke-width="2"/>
  <circle cx="200" cy="30" r="3.4" fill="#2aa2ff"/>

  <!-- bola 8 -->
  <ellipse cx="200" cy="152" rx="50" ry="7" fill="#000" opacity=".5"/>
  <circle cx="200" cy="96" r="54" fill="url(#ball)" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="200" cy="82" r="23" fill="#fff"/>
  <text x="200" y="95" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="34" fill="#111">8</text>
  <ellipse cx="176" cy="60" rx="14" ry="7" fill="#fff" opacity=".2" transform="rotate(-35 176 60)"/>

  <!-- DMR -->
  <text x="200" y="152" text-anchor="middle" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-style="italic" font-size="84" letter-spacing="3"
        fill="url(#gold)" stroke="#2a1604" stroke-width="5" paint-order="stroke" stroke-linejoin="round">DMR</text>

  <!-- cinta POOL EMPIRE -->
  <path d="M52 170h296l-14 22 14 22H52l14-22z" fill="url(#ribbon)" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
  <text x="200" y="203" text-anchor="middle" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-style="italic" font-size="30" letter-spacing="6"
        fill="#fff" stroke="#031024" stroke-width="3" paint-order="stroke">POOL EMPIRE</text>
  <path d="M76 224h248" stroke="url(#gold)" stroke-width="2" opacity=".7"/>
</svg>